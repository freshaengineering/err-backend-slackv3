name: slackv3-tests

on:
  push:
    branches: '**'
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v2
        with:
          python-version: "3.9"
      - name: install deps
        run: |
          pip install errbot[slack] mock pytest pytest-pep8 coverage
          pip install -r requirements.txt
      - name: unittests
        run: |
          pytest
      - name: coverage
        run: |
          coverage run slackv3.py --pep8
          coverage report -m --fail-under 24
