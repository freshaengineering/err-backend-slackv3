name: slackv3-tests

on:
  push:
    branches: '**'
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - name: Setup mise
        uses: step-security/mise-action@2796166110dee826668caddd4bffedae5116e7cd # v4.2.0
        with:
          mise_toml: |
            [tools]
            python = "3.9"
      - name: install deps
        run: |
          pip install errbot[slack] mock pytest pytest-pep8 coverage
          pip install -r requirements.txt
      - name: unittests
        run: |
          pytest
      - name: coverage
        run: |
          coverage run slackv3.py --pep8
          coverage report -m --fail-under 24
